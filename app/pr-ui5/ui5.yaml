specVersion: "4.0"
metadata:
  name: sap.ui.prui5
type: application
framework:
  name: OpenUI5
  version: "1.139.0"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.uxap
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion

server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /odata/v4
      configuration:
        baseUri: http://localhost:4004/odata/v4
